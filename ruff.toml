exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".lingma",
    "test_*",
    "result.json",
    "data",
    "*.png",
    ".vscode",
    ".venv*",
    "doc",
    "dataset",
    "*.onnx",
    "*.jpg",
    ".pytest_cache",
    "__trtcache__"
]

target-version = "py37"

line-length = 88

[lint]
select = [
    "E", "W", "F", "I", "B", "UP", "C4", "SIM"
]

ignore = ["E402", "E501", "UP045", "UP006", "UP007"]
fixable = ["ALL"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"